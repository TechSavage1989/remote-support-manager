name: Release

# Publishes releases the way the owner's other app repositories do: GitHub
# Actions publishes when new release notes reach main. On a push to main that
# changes docs/releases/, the newest docs/releases/<version>.md is published
# (tag v<version> on that commit) unless it is already released. A pushed
# v<version> tag or a manual run with an existing tag also works. Guards:
#   - the commit must be on main (checks and tests run again here);
#   - the version must be newer than every published release;
#   - docs/releases/<version>.md must exist and becomes the release notes;
#   - an existing release is never replaced (rsm-release also never overwrites update files);
#   - versions with a "-" suffix (for example 0.2.0-preview.1) are marked pre-release.
# Every executable is signed with Azure Artifact Signing (same account and
# certificate profile as the owner's other apps) before the installers embed
# it; a release is never published unsigned. See docs/CODE_SIGNING.md.

on:
  push:
    branches: [main]
    paths: ['docs/releases/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v0.2.0-preview.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

# Azure Artifact Signing configuration (not secret). The sign-in identifiers
# are the AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets.
env:
  SIGN_ENDPOINT: https://eus.codesigning.azure.net
  SIGN_ACCOUNT: networktoolkit-signing
  SIGN_PROFILE: jpaull-codesign
  SIGN_TOOL_VERSION: '0.9.1-beta.26552.4'
  SIGN_TIMESTAMP_URL: http://timestamp.acs.microsoft.com

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    env:
      INPUT_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose and validate the version
        id: v
        run: |
          set -euo pipefail
          git fetch -q --tags origin main
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"; commit="$(git rev-list -n1 "$TAG")"; auto=false
          else
            ver="$(ls docs/releases/*.md | sed 's|.*/||; s|\.md$||' | sort -V | tail -n1)"
            TAG="v$ver"; commit="$(git rev-parse HEAD)"; auto=true
          fi
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is not v<major>.<minor>.<patch>[-suffix]"; exit 1;; esac
          ver="${TAG#v}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then echo "::error::bad version $ver"; exit 1; fi
          publish=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$auto" = true ]; then echo "$TAG is already published; nothing to do."; publish=false
            else echo "::error::release $TAG already exists; published releases are never replaced"; exit 1; fi
          fi
          if [ "$publish" = true ]; then
            git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$commit is not on main"; exit 1; }
            test -f "docs/releases/$ver.md" || { echo "::error::docs/releases/$ver.md is missing"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ "$(git rev-list -n1 "$TAG")" != "$commit" ]; then
              echo "::error::tag $TAG already points at another commit"; exit 1
            fi
            newest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -n1)"
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$ver" | sort -V | tail -n1)" != "$ver" ]; then
              echo "::error::$ver is not newer than the published $newest"; exit 1
            fi
          fi
          pre=false; case "$ver" in *-*) pre=true;; esac
          { echo "tag=$TAG"; echo "version=$ver"; echo "commit=$commit"; echo "prerelease=$pre"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.v.outputs.publish == 'true'
        with:
          go-version-file: go.mod
      - name: Checks and tests
        if: steps.v.outputs.publish == 'true'
        run: |
          bash scripts/check-root.sh
          bash scripts/test-check-root.sh
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    # The "release" environment gives the OIDC token the subject
    # repo:TechSavage1989/remote-support-manager:environment:release, which
    # the Entra federated credential matches exactly.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VER: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require code signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::Code signing is required: set AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (docs/CODE_SIGNING.md). Releases are never published unsigned."
            exit 1
          fi
      - name: Install the Azure Artifact Signing client
        run: dotnet tool install --global sign --version "$SIGN_TOOL_VERSION"
      - name: Sign in to Azure with OIDC (no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and sign the Windows package
        env:
          RSM_SIGN: '1'
        run: |
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          bash scripts/build-windows.sh "$VER"
      - name: Sign out of Azure
        if: always()
        run: az logout || true; az account clear || true
      - name: Verify the package and every signature
        run: |
          set -euo pipefail
          cd dist
          z="RemoteSupportManager-$VER-windows-x64.zip"
          sha256sum -c "$z.sha256"
          python - "$z" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          need = ["RemoteSupportServerSetup.exe", "rsm-server.exe", "rsm-release.exe", "downloads/RemoteSupportAgent.exe", "downloads/RemoteSupportViewer.exe", "downloads/RemoteSupportViewerSetup.exe"]
          missing = [n for n in need if not any(x.endswith("/" + n) for x in names)]
          if missing: sys.exit("missing from the zip: " + ", ".join(missing))
          PY
          rm -rf verify && mkdir verify && (cd verify && python -m zipfile -e "../$z" .)
          powershell.exe -NoProfile -NonInteractive -Command '
            $bad = 0
            Get-ChildItem -Recurse -Filter *.exe verify | ForEach-Object {
              $s = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($s.Status -ne "Valid" -or -not $s.TimeStamperCertificate) { Write-Error "$($_.Name): $($s.Status)"; $bad++ } else { Write-Output "OK $($_.Name)" }
            }
            exit $bad'
      - name: Publish
        run: |
          set -euo pipefail
          z="dist/RemoteSupportManager-$VER-windows-x64.zip"
          { tail -n +3 "docs/releases/$VER.md"
            printf '\n**Code-signed test build** (Azure Artifact Signing). Check the zip against the `.sha256` file.\n'
            printf '\nBuilt by the Release workflow from %s.\n' "$COMMIT"
          } > notes.md
          flags=()
          [ "${{ needs.check.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "$z" "$z.sha256" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "Remote Support Manager $VER" --notes-file notes.md "${flags[@]}"
      - name: Check the published assets
        run: |
          set -euo pipefail
          mkdir check && cd check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum -c ./*.sha256
